name: Build entry lists

on:
  push:
    branches: ["**"]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build-lists:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Regenerate news and devlog entry lists
        shell: bash
        run: |
          set -e

          write_list () {
            dir="$1"      # folder holding entries/ and entry-list.js
            varname="$2"  # JS variable name
            out="$dir/entry-list.js"
            [ -d "$dir/entries" ] || return 0
            {
              echo "// Generated by .github/workflows/build-entry-lists.yml — do not edit by hand."
              echo "// Add or remove a file in entries/ and this list rebuilds on push."
              echo "const $varname = ["
              for f in $(ls "$dir/entries" | grep -E '\.js$' | grep -v '^_' | sort); do
                echo "    \"entries/$f\","
              done
              echo "];"
            } > "$out"
            echo "wrote $out"
          }

          write_list "news" "newsFiles"

          for d in devlogs/*/; do
            [ -d "$d/entries" ] || continue
            write_list "${d%/}" "entryFiles"
          done

      - name: Commit if changed
        run: |
          if [ -n "$(git status --porcelain)" ]; then
            git config user.name "github-actions[bot]"
            git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
            git add news/entry-list.js devlogs/*/entry-list.js
            git commit -m "Rebuild entry lists"
            git push
          else
            echo "No changes."
          fi
